<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelajah Kecergasan 2026 Peringkat Kebangsaan</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Kenangan</span>
            <h2>Galeri Gambar</h2>
          </div>
        </div>

        <div class="subtab-bar" id="subtab-bar"></div>

        <div class="gallery-grid" id="galeri-grid">
          <div class="loading-pulse">Memuatkan gambar...</div>
        </div>
      </div>
    </section>

    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightbox-close" aria-label="Tutup">
        &times;
      </button>
      <button
        class="lightbox-nav lightbox-prev"
        id="lightbox-prev"
        aria-label="Sebelum"
      >
        &#10094;
      </button>
      <img class="lightbox-img" id="lightbox-img" src="" alt="" />
      <div class="lightbox-cap" id="lightbox-cap"></div>
      <button
        class="lightbox-nav lightbox-next"
        id="lightbox-next"
        aria-label="Seterus"
      >
        &#10095;
      </button>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/include.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/galeri.js"></script>
  </body>
</html>
