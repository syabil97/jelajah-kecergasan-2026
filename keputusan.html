<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelajah Kecergasan 2026 Peringkat Kebangsaan</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* Kad "Keputusan Ikut Acara" (jenis kedudukan: juara/naib juara/ketiga) */
      .kedudukan-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 24px;
      }
      .kedudukan-card {
        border: 1px solid #dde3e9;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .kedudukan-card-head {
        background: #c3d69b;
        color: #1c2733;
        font-weight: 700;
        font-size: 14px;
        padding: 10px 16px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .kedudukan-card-body {
        padding: 6px 16px;
      }
      .kedudukan-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid #eef1f4;
      }
      .kedudukan-row:last-child {
        border-bottom: none;
      }
      .kedudukan-label {
        flex: 0 0 130px;
        font-size: 13px;
        color: #6b7785;
        font-weight: 600;
      }
      .kedudukan-pasukan {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .kedudukan-row-bersama {
        align-items: flex-start;
      }
      .kedudukan-pasukan-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .kedudukan-pasukan-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .kedudukan-rumi {
        font-size: 12px;
        color: #6b7785;
        width: 22px;
      }
      .kedudukan-pasukan .team-dot,
      .kedudukan-pasukan-item .team-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        flex: 0 0 auto;
      }
      .kedudukan-pasukan .team-flag,
      .kedudukan-pasukan-item .team-flag {
        width: 24px;
        height: 16px;
        border-radius: 2px;
        object-fit: cover;
        vertical-align: middle;
        margin-right: 2px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow">Perlawanan</span>
            <h2>Keputusan Mengikut Sukan</h2>
          </div>
        </div>

        <div class="subtab-bar" id="subtab-bar">
          <div class="loading-pulse">Memuatkan senarai sukan...</div>
        </div>

        <div id="senarai-perlawanan">
          <div class="loading-pulse">Memuatkan perlawanan...</div>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/include.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/keputusan.js"></script>
  </body>
</html>
