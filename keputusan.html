  .kedudukan-list{display:flex;flex-direction:column;gap:16px;margin-bottom:24px;}
  .kedudukan-card{border:1px solid #dde3e9;border-radius:10px;overflow:hidden;background:#fff;}

  .kedudukan-pasukan-item{display:flex;align-items:center;gap:8px;}
  .kedudukan-rumi{font-size:12px;color:#6b7785;width:22px;}
  .kedudukan-pasukan .team-dot,.kedudukan-pasukan-item .team-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;}
  .kedudukan-pasukan .team-flag,.kedudukan-pasukan-item .team-flag{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:2px;border:1px solid rgba(0,0,0,.08);}
