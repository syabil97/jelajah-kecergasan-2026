<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelajah Kecergasan 2026 Peringkat Kebangsaan</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/partials.css">
<style>
  .team-cell{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;}
  .team-flag{width:28px;height:18px;min-width:28px;border-radius:3px;object-fit:cover;flex:0 0 auto;border:1px solid rgba(0,0,0,.08);}
  .team-name{white-space:nowrap;}
  .col-rank{width:36px;text-align:center;}
</style>
</head>
<body>

 <div id="header-placeholder"></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">Papan Skor</span>
        <h2>Pungutan Pingat Penuh</h2>
      </div>
    </div>

    <div class="full-table-wrap">
      <table class="full-table">
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th>Pasukan</th>
            <th class="col-emas">🥇 Emas</th>
            <th class="col-perak">🥈 Perak</th>
            <th class="col-gangsa">🥉 Gangsa</th>
            <th class="col-jumlah">Jumlah</th>
          </tr>
        </thead>
        <tbody id="jadual-pingat">
          <tr><td colspan="6" class="loading-pulse">Memuatkan...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/include.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/pingat.js"></script>
<script src="js/counter.js"></script>
<script src="js/visitor-widget.js"></script>
</body>
</html>
