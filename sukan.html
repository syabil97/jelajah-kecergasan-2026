<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelajah Kecergasan 2026 Peringkat Kebangsaan</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sukan.css">
</head>
<body>

  <div id="header-placeholder"></div>

<section class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">Jadual</span>
        <h2>Semua Acara Sukan</h2>
      </div>
      <select id="tapis-status" style="font-family:var(--font-display);text-transform:uppercase;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid #ccc;">
        <option value="">Semua Status</option>
        <option value="akan_datang">Akan Datang</option>
        <option value="sedang_berlangsung">Sedang Berlangsung</option>
        <option value="selesai">Selesai</option>
        <option value="ditangguhkan">Ditangguhkan</option>
      </select>
    </div>

    <div class="subtab-bar" id="subtab-bar">
      <div class="loading-pulse">Memuatkan senarai sukan...</div>
    </div>

    <div class="grid grid-3" id="senarai-acara">
      <div class="loading-pulse">Memuatkan acara...</div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/include.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/sukan.js"></script>
</body>
</html>
